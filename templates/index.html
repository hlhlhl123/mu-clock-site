<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Hunter — 电商价格采集对比工具</title>
<style>
:root {
  --bg: #f5f7fa;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-secondary: #7f8c8d;
  --border: #e8ecf1;
  --accent: #4E79A7;
  --accent-light: #e8f0fe;
  --green: #27ae60;
  --orange: #e67e22;
  --red: #e74c3c;
  --gold: #f39c12;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.container { max-width: 1300px; margin: 0 auto; padding: 20px 24px; }

header {
  background: linear-gradient(135deg, #2c3e50 0%, #4E79A7 100%);
  color: white;
  padding: 28px 0;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
header h1 { font-size: 2em; font-weight: 700; letter-spacing: -0.5px; }
header p { opacity: 0.85; margin-top: 6px; font-size: 0.95em; }

.search-section {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin: 24px 0;
  box-shadow: var(--shadow);
}
.search-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 220px;
  padding: 12px 18px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 1em;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 10px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #3d6894; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(78,121,167,0.3); }
.btn-outline { background: white; color: var(--accent); border: 2px solid var(--accent); }
.btn-outline:hover { background: var(--accent-light); }
.btn-sm { padding: 6px 14px; font-size: 0.82em; border-radius: 8px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.keywords-bar {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.keywords-bar span { font-size: 0.85em; color: var(--text-secondary); }
.keyword-tag {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.82em;
  cursor: pointer;
  border: 1px solid var(--border);
  background: white;
  transition: all 0.2s;
}
.keyword-tag:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

.status-bar {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-top: 12px;
  font-size: 0.85em;
  color: var(--text-secondary);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.idle { background: #bdc3c7; }
.status-dot.loading { background: var(--gold); animation: pulse 0.8s infinite; }
.status-dot.done { background: var(--green); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow);
  text-align: center;
}
.stat-card .stat-value { font-size: 1.8em; font-weight: 700; color: var(--accent); }
.stat-card .stat-label { font-size: 0.82em; color: var(--text-secondary); margin-top: 4px; }

.section-title {
  font-size: 1.25em;
  font-weight: 700;
  margin: 28px 0 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.insights-bar {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--accent);
}
.insights-bar p { margin: 4px 0; font-size: 0.9em; }
.insights-bar p::before { content: "💡 "; }

.table-wrapper {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th { background: #f8f9fb; padding: 14px 16px; text-align: left; font-weight: 600; font-size: 0.85em; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.88em; }
tr:hover td { background: #f8f9fb; }

.price { font-weight: 700; color: var(--red); font-size: 1.05em; }
.price-low { color: var(--green); }
.rating-stars { color: var(--gold); }
.sales-num { color: var(--accent); font-weight: 600; }

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75em;
  font-weight: 600;
  margin: 1px 2px;
}
.badge-best { background: #d4edda; color: #155724; }
.badge-recommend { background: #fff3cd; color: #856404; }
.badge-consider { background: #d1ecf1; color: #0c5460; }
.badge-normal { background: #e2e3e5; color: #383d41; }
.badge-hot { background: #f8d7da; color: #721c24; }
.badge-high-rating { background: #e8daef; color: #6c3483; }
.badge-low-price { background: #d5f5e3; color: #1e8449; }

.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.chart-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.chart-card img {
  width: 100%;
  height: auto;
  border-radius: 8px;
}

.top-section {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.top-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.top-card h3 { font-size: 0.9em; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.top-card .top-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.top-card .top-item:last-child { border: none; }
.top-card .top-name { font-weight: 600; font-size: 0.85em; flex: 1; margin-right: 8px; }
.top-card .top-meta { font-size: 0.8em; color: var(--text-secondary); white-space: nowrap; }

.spinner { display: none; text-align: center; padding: 40px; }
.spinner.active { display: block; }
.spinner-inner {
  display: inline-block;
  width: 40px; height: 40px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 4em; margin-bottom: 16px; }

.results-area { display: none; }
.results-area.active { display: block; }

footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 0.82em; }

@media (max-width: 768px) {
  .top-section { grid-template-columns: 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .search-row { flex-direction: column; }
  .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<header>
  <h1>Price Hunter</h1>
  <p>电商商品价格自动化采集与智能对比平台</p>
</header>

<div class="container">

<div class="search-section">
  <div class="search-row">
    <input type="text" class="search-input" id="keywordInput"
           placeholder="输入商品关键词，如：无线耳机、机械键盘、显示器..."
           autocomplete="off">
    <button class="btn btn-primary" id="searchBtn" onclick="doSearch()">
      <span>🔍</span> 开始搜索
    </button>
    <button class="btn btn-outline btn-sm" onclick="loadDemo()">
      📋 加载示例
    </button>
  </div>
  <div class="keywords-bar">
    <span>🔥 热门关键词:</span>
    <span id="keywordTags"></span>
  </div>
  <div class="status-bar">
    <span class="status-dot idle" id="statusDot"></span>
    <span id="statusText">就绪，输入关键词开始搜索</span>
  </div>
</div>

<div class="spinner" id="spinner">
  <div class="spinner-inner"></div>
  <p style="margin-top:12px;color:var(--text-secondary)">正在采集商品数据...</p>
</div>

<div class="results-area" id="resultsArea">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="insights-bar" id="insightsBar"></div>

  <div class="top-section">
    <div class="top-card" id="topBestValue"></div>
    <div class="top-card" id="topRated"></div>
    <div class="top-card" id="topSellers"></div>
  </div>

  <h3 class="section-title">📋 商品对比列表 (按价格从低到高)</h3>
  <div class="table-wrapper">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>商品名称</th>
            <th>价格</th>
            <th>评分</th>
            <th>销量</th>
            <th>店铺</th>
            <th>性价比</th>
            <th>标签</th>
            <th>链接</th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </div>

  <h3 class="section-title">📊 数据可视化</h3>
  <div class="charts-grid" id="chartsGrid"></div>

</div>

<div class="empty-state" id="emptyState">
  <div class="icon">🛒</div>
  <h3>开始搜索商品</h3>
  <p style="margin-top:8px;">输入关键词搜索，或点击「加载示例」查看演示数据</p>
</div>

</div>

<footer>
  Price Hunter — 电商价格采集对比工具 Demo | 数据来源: 模拟演示数据
</footer>

<script>
let currentData = null;

async function fetchKeywords() {
  try {
    const resp = await fetch("/api/keywords");
    const data = await resp.json();
    renderKeywords(data.keywords);
  } catch(e) {}
}

function renderKeywords(keywords) {
  const container = document.getElementById("keywordTags");
  container.innerHTML = keywords.map(kw =>
    `<button class="keyword-tag" onclick="quickSearch('${kw}')">${kw}</button>`
  ).join("");
}

function quickSearch(kw) {
  document.getElementById("keywordInput").value = kw;
  doSearch();
}

function setStatus(state, text) {
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot " + state;
  document.getElementById("statusText").textContent = text;
}

async function loadDemo() {
  document.getElementById("keywordInput").value = "无线耳机（示例）";
  setStatus("loading", "正在加载示例数据...");
  document.getElementById("spinner").classList.add("active");
  document.getElementById("resultsArea").classList.remove("active");
  document.getElementById("emptyState").style.display = "none";

  const resp = await fetch("/api/demo");
  const data = await resp.json();
  renderResults(data);
  document.getElementById("spinner").classList.remove("active");
  setStatus("done", `示例已加载: ${data.keyword} — 共 ${data.products.length} 件商品`);
}

async function doSearch() {
  const keyword = document.getElementById("keywordInput").value.trim();
  if (!keyword) {
    document.getElementById("keywordInput").focus();
    setStatus("idle", "请输入搜索关键词");
    return;
  }

  setStatus("loading", `正在搜索: ${keyword} ...`);
  document.getElementById("spinner").classList.add("active");
  document.getElementById("resultsArea").classList.remove("active");
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("searchBtn").disabled = true;

  const resp = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
  const data = await resp.json();

  document.getElementById("searchBtn").disabled = false;
  document.getElementById("spinner").classList.remove("active");

  if (data.error) {
    setStatus("idle", data.error);
    if (data.available_keywords) {
      renderKeywords(data.available_keywords);
    }
    return;
  }

  renderResults(data);
  setStatus("done", `搜索完成: ${data.keyword} — 共 ${data.products.length} 件商品 (${data.source === "mock" ? "模拟数据" : "实时抓取"})`);
}

function renderResults(data) {
  currentData = data;
  document.getElementById("resultsArea").classList.add("active");

  const stats = data.statistics;
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="stat-value">${stats.total_products}</div><div class="stat-label">商品数量</div></div>
    <div class="stat-card"><div class="stat-value">¥${stats.price.min.toFixed(0)}</div><div class="stat-label">最低价格</div></div>
    <div class="stat-card"><div class="stat-value">¥${stats.price.max.toFixed(0)}</div><div class="stat-label">最高价格</div></div>
    <div class="stat-card"><div class="stat-value">¥${stats.price.avg.toFixed(0)}</div><div class="stat-label">平均价格</div></div>
    <div class="stat-card"><div class="stat-value">${stats.rating.avg}</div><div class="stat-label">平均评分</div></div>
    <div class="stat-card"><div class="stat-value">${(stats.sales.total / 10000).toFixed(1)}万</div><div class="stat-label">累计销量</div></div>
  `;

  const rec = data.recommendations;
  document.getElementById("insightsBar").innerHTML = rec.insights.map(i => `<p>${i}</p>`).join("");

  renderTopCard("topBestValue", "🏆 性价比之王", rec.top_by_cp_score || []);
  renderTopCard("topRated", "⭐ 评分最高", rec.highest_rated || []);
  renderTopCard("topSellers", "🔥 热销爆款", rec.bestsellers || []);

  const tbody = document.getElementById("productTableBody");
  tbody.innerHTML = data.products.map((p, i) => {
    const priceClass = p.price <= stats.price.avg * 0.7 ? "price price-low" : "price";
    const stars = "★".repeat(Math.round(p.rating)) + "☆".repeat(5 - Math.round(p.rating));
    const labels = (p.label || []).map(l => {
      let cls = "badge-normal";
      if (l.includes("性价比之王")) cls = "badge-best";
      else if (l.includes("推荐")) cls = "badge-recommend";
      else if (l.includes("考虑")) cls = "badge-consider";
      else if (l.includes("热销") || l.includes("爆款")) cls = "badge-hot";
      else if (l.includes("高评")) cls = "badge-high-rating";
      else if (l.includes("低价")) cls = "badge-low-price";
      return `<span class="badge ${cls}">${l}</span>`;
    }).join(" ");

    const cpScore = p.cp_score || 0;
    let cpHtml = `${cpScore}分`;
    if (cpScore >= 80) cpHtml = `<span style="color:var(--green);font-weight:700">⭐ ${cpScore}分</span>`;
    else if (cpScore >= 60) cpHtml = `<span style="color:var(--orange);font-weight:600">${cpScore}分</span>`;

    const urlLink = p.url ? `<a href="${p.url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:0.8em">🔗</a>` : "-";

    return `<tr>
      <td>${i + 1}</td>
      <td><strong>${p.name}</strong></td>
      <td class="${priceClass}">¥${p.price.toFixed(2)}</td>
      <td><span class="rating-stars">${stars}</span> ${p.rating}</td>
      <td class="sales-num">${(p.sales / 10000).toFixed(1)}万</td>
      <td>${p.shop}</td>
      <td>${cpHtml}</td>
      <td>${labels}</td>
      <td>${urlLink}</td>
    </tr>`;
  }).join("");

  renderCharts(data.charts);
}

function renderTopCard(id, title, items) {
  const container = document.getElementById(id);
  if (!items.length) {
    container.innerHTML = `<h3>${title}</h3><p style="color:var(--text-secondary);font-size:0.85em">暂无数据</p>`;
    return;
  }
  container.innerHTML = `<h3>${title}</h3>` + items.slice(0, 3).map(p => `
    <div class="top-item">
      <span class="top-name">${(p.name || "").substring(0, 18)}</span>
      <span class="top-meta">¥${(p.price || 0).toFixed(0)} | ★${(p.rating || 0).toFixed(1)}</span>
    </div>
  `).join("");
}

function renderCharts(charts) {
  if (!charts) return;
  const grid = document.getElementById("chartsGrid");
  grid.innerHTML = "";

  const chartDefs = [
    { key: "price_bar", title: "价格横向对比" },
    { key: "price_distribution", title: "价格分布直方图" },
    { key: "rating_scatter", title: "评分 vs 价格 (气泡=销量)" },
    { key: "price_trend", title: "历史价格趋势" },
    { key: "cp_score", title: "性价比评分排名" },
  ];

  chartDefs.forEach(def => {
    if (charts[def.key]) {
      grid.innerHTML += `
        <div class="chart-card">
          <h4 style="margin-bottom:12px;font-size:0.95em">${def.title}</h4>
          <img src="data:image/png;base64,${charts[def.key]}" alt="${def.title}">
        </div>`;
    }
  });
}

document.getElementById("keywordInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

fetchKeywords();
loadDemo();
</script>

</body>
</html>
